[build-system]
requires = [
	"flit_core >=3.2,<4"
	]
build-backend = "flit_core.buildapi"

[project]
name = "RDMatcher"
authors = [{name = "Noah Baker", email = "noah.baker@ucsf.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dynamic = ["version", "description"]
dependencies = [
    "pandas", "numpy", "scikit-learn", "matplotlib", "seaborn", "scipy"
]

[project.optional-dependencies]
test = ["pytest"]
mcf = ["ortools>=9.7"]

[project.urls]
Home = "https://github.com/noahrbaker/RDMatcher"
