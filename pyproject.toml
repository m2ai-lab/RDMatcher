[build-system]
requires = [
	"flit_core >=3.2,<4",
	"python_version >='3.7'"
	]
build-backend = "flit_core.buildapi"

[project]
name = "RDMatcher"
authors = [{name = "Noah Baker", email = "noah.baker@ucsf.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    "pytest", "pandas", "numpy", "scikit-learn", "matplotlib", "seaborn", "scipy"
]

[project.optional-dependencies]
# Optional dependencies for sparse min-cost-flow matching
mcf = ["ortools>=9.7"]

[project.urls]
Home = "https://github.com/noahrbaker/RDMatcher"

[tool.setuptools.packages.find]
where = ["src"]
